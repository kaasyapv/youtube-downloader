appId: com.kaasyap.youtube-downloader
productName: YouTube Downloader
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!node_modules/**"
asar: true
mac:
  target:
    - dmg
    - zip
  identity: null
  category: public.app-category.utilities
  extraResources:
    - from: resources/bin/darwin-arm64
      to: bin
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  extraResources:
    - from: resources/bin/win32-x64
      to: bin
# versionless artifact names so releases/latest/download/ links never go stale
nsis:
  oneClick: true
  artifactName: YouTube-Downloader-Setup.${ext}
portable:
  artifactName: YouTube-Downloader-Portable.${ext}
dmg:
  artifactName: YouTube-Downloader.${ext}
npmRebuild: false
