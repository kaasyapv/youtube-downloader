appId: com.kaasyap.youtube-downloader
productName: YouTube Downloader
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!node_modules/**"
asar: true
# embeds app-update.yml so electron-updater knows where releases live.
# releaseType: release -> upload into the existing published release for the tag
# (the default "draft" refuses to touch an already-published release and skips uploads)
publish:
  provider: github
  owner: kaasyapv
  repo: youtube-downloader
  releaseType: release
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  # signs with Developer ID when CSC_LINK/keychain identity exists, ad-hoc otherwise;
  # notarization runs automatically when APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID are set
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: resources/bin/darwin-arm64
      to: bin
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  extraResources:
    - from: resources/bin/win32-x64
      to: bin
# versionless artifact names so releases/latest/download/ links never go stale
nsis:
  oneClick: true
  artifactName: YouTube-Downloader-Setup.${ext}
portable:
  artifactName: YouTube-Downloader-Portable.${ext}
dmg:
  artifactName: YouTube-Downloader.${ext}
npmRebuild: false
