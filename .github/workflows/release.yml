name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # run with --ref <tag> to (re)build an existing release

permissions:
  contents: write

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # --publish always uploads installers AND latest*.yml update metadata,
      # which electron-updater in the app reads to detect and install updates.
      # macOS signing + notarization activate automatically once the Apple
      # secrets below are configured (see docs/SIGNING.md); until then the
      # build stays ad-hoc signed and CI remains green.
      # secrets are exported only when set: an empty CSC_LINK/APPLE_ID makes
      # electron-builder treat it as a real cert path / notarization attempt
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          SEC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          SEC_APPLE_ID: ${{ secrets.APPLE_ID }}
          SEC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SEC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$SEC_CSC_LINK" ]; then
            export CSC_LINK="$SEC_CSC_LINK" CSC_KEY_PASSWORD="$SEC_CSC_KEY_PASSWORD"
          fi
          if [ -n "$SEC_APPLE_ID" ]; then
            export APPLE_ID="$SEC_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$SEC_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$SEC_APPLE_TEAM_ID"
          fi
          npm run ${{ matrix.script }} -- --publish always
